name: Build release artifacts

# TRD §14.1–§14.5. This reusable workflow builds every artifact and, when `attest` is true, is
# the attestation signer, so the build instructions stay isolated from the calling workflow
# (SLSA Build L3 route for GitHub artifact attestations). It uses no caches and no long-lived
# secrets. `workflow_dispatch` runs it unsigned as a dry run.
on:
  workflow_call:
    inputs:
      attest:
        description: Issue build-provenance and SBOM attestations
        type: boolean
        default: false
      prefix:
        description: Artifact name prefix, so two builds of one tag can be compared
        type: string
        default: build
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PREFIX: ${{ inputs.prefix || 'build' }}

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, ext: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, ext: tar.gz }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, ext: tar.gz, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, ext: tar.gz, musl: true }
          - { target: x86_64-apple-darwin, os: macos-15, ext: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-15, ext: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-2025, ext: zip }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, ext: zip }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - if: runner.os == 'Linux'
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
          rustup component add llvm-tools
      - if: matrix.musl
        run: sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build (TRD §14.4 reproducibility inputs)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export RUSTFLAGS="--remap-path-prefix=$PWD=/build --remap-path-prefix=$HOME=/home"
          cargo build --locked --release -p spymonk-redact --target "${{ matrix.target }}"
          # Static binaries carry no import table, so check an unstripped twin of the same code.
          CARGO_PROFILE_RELEASE_STRIP=none cargo build --locked --release -p spymonk-redact \
            --target "${{ matrix.target }}" --target-dir target/import-check
      - name: No networking or process-creation imports (TRD §9.8)
        run: |
          exe=""; case "${{ matrix.target }}" in *windows*) exe=".exe" ;; esac
          tools/check-imports.sh "target/import-check/${{ matrix.target }}/release/spymonk-redact$exe"
      - name: Package
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          exe=""; case "${{ matrix.target }}" in *windows*) exe=".exe" ;; esac
          mkdir -p dist
          python3 -I tools/package-archive.py binary \
            "dist/spymonk-redact-$version-${{ matrix.target }}.${{ matrix.ext }}" \
            "target/${{ matrix.target }}/release/spymonk-redact$exe" LICENSE README.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PREFIX }}-bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, manylinux: "2_17" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, manylinux: "2_17" }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, manylinux: musllinux_1_2 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, manylinux: musllinux_1_2 }
          - { target: x86_64-apple-darwin, os: macos-15 }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reproducibility inputs
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cmp LICENSE python/LICENSE
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.15.0"
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'off' }}
          args: --release --locked --out dist -m python/pyproject.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PREFIX }}-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  sdist:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.15.0"
          command: sdist
          args: --out dist -m python/pyproject.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PREFIX }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  web:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain and wasm-bindgen-cli
        run: |
          rustup toolchain install
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
      - name: Build and package the site bundle
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export RUSTFLAGS="--remap-path-prefix=$PWD=/build --remap-path-prefix=$HOME=/home"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          (cd web && npm ci && npm audit signatures && npm run build)
          mkdir -p dist
          python3 -I tools/package-archive.py web "dist/spymonk-redact-web-$version.tar.gz" web/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PREFIX }}-web
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  image:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ env.PREFIX }}-bin-*-linux-musl
          path: musl
          merge-multiple: true
      - name: Build the OCI image (linux/amd64, linux/arm64)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          mkdir -p context/linux-amd64 context/linux-arm64 dist
          tar -xzf "musl/spymonk-redact-$version-x86_64-unknown-linux-musl.tar.gz" --strip-components=1 -C context/linux-amd64
          tar -xzf "musl/spymonk-redact-$version-aarch64-unknown-linux-musl.tar.gz" --strip-components=1 -C context/linux-arm64
          docker buildx create --use --name repro
          docker buildx build --platform linux/amd64,linux/arm64 -f packaging/Containerfile \
            --build-arg "VERSION=$version" --build-arg "REVISION=$(git rev-parse HEAD)" \
            --output "type=oci,dest=dist/spymonk-redact-image-$version.oci.tar,rewrite-timestamp=true" context
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PREFIX }}-image
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  checksums:
    needs: [binaries, wheels, sdist, web, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ env.PREFIX }}-*
          path: dist
          merge-multiple: true
      - name: SBOMs (CycloneDX) for the CLI and the WebAssembly engine
        run: |
          rustup toolchain install
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --manifest-path crates/cli/Cargo.toml
          cargo cyclonedx --format json --manifest-path crates/wasm/Cargo.toml
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          mkdir -p sbom
          cp crates/cli/spymonk-redact.cdx.json "sbom/spymonk-redact-$version.cdx.json"
          cp crates/wasm/spymonk-redact-wasm.cdx.json "sbom/spymonk-redact-web-$version.cdx.json"
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum -- * | LC_ALL=C sort -k 2 > ../SHA256SUMS
          cat ../SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PREFIX }}-sums
          path: |
            SHA256SUMS
            sbom/*
          if-no-files-found: error
          retention-days: 7

  attest:
    if: inputs.attest
    needs: checksums
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ env.PREFIX }}-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.whl
            dist/*.oci.tar
            dist/SHA256SUMS
      - id: version
        run: echo "value=$(ls dist/sbom | sed -n 's/^spymonk-redact-web-//p' | sed 's/[.]cdx[.]json$//')" >> "$GITHUB_OUTPUT"
      - name: Attest the CLI SBOM to the archives, wheels, and image
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/spymonk-redact-${{ steps.version.outputs.value }}-*
            dist/spymonk_redact-*.whl
            dist/spymonk-redact-image-*.oci.tar
          sbom-path: dist/sbom/spymonk-redact-${{ steps.version.outputs.value }}.cdx.json
      - name: Attest the web SBOM to the site bundle
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/spymonk-redact-web-*.tar.gz
          sbom-path: dist/sbom/spymonk-redact-web-${{ steps.version.outputs.value }}.cdx.json
