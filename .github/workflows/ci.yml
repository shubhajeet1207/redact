name: CI

on:
  push:
    branches: [main]
  pull_request:

# TRD §15.2: no default token permissions; each job requests only what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Generated rule docs are in sync
        run: cargo run --locked -p spymonk-redact-rules --bin gen-docs -- --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - if: runner.os == 'Linux'
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --release
      - name: Linux hardening (seccomp filter, not dumpable, no core dumps)
        if: runner.os == 'Linux'
        run: cargo test -p spymonk-redact --locked --features sandbox-probe --test platform
      - name: Release binary imports no networking or process-creation APIs (TRD §9.8)
        shell: bash
        run: |
          rustup component add llvm-tools
          cargo build --locked --release -p spymonk-redact
          bin=target/release/spymonk-redact
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          tools/check-imports.sh "$bin"
      - name: Zero network or process syscalls over the corpus (TRD §19.7)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends strace
          tools/check-no-network.sh target/release/spymonk-redact

  web:
    # TRD §10, §19.7–§19.8: the browser playground is linted, unit-tested, built, verified
    # (single entry, SRI, meta CSP, embedded engine), and tested in Chromium under the
    # production headers.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain and wasm-bindgen-cli
        working-directory: .
        run: |
          rustup toolchain install
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
      - run: npm ci
      - run: npm run wasm
      - run: npm run lint
      - run: npm test
      - name: Build and verify the bundle
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: npx vite build && node scripts/verify-dist.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e

  package:
    # TRD §9.9, §14.4: the wheel installs and runs both entry points with exit codes passed
    # through, the licence copy matches, and release archives are reproducible.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Wheel and launcher smoke test
        run: |
          cmp LICENSE python/LICENSE
          python3 -m venv /tmp/build
          /tmp/build/bin/pip install --require-hashes -r python/build-requirements.txt
          (cd python && /tmp/build/bin/maturin build --release --locked --out ../wheels)
          python3 -m venv /tmp/run
          /tmp/run/bin/pip install wheels/*.whl
          test "$(echo 'password=x' | /tmp/run/bin/spymonk-redact 2>/dev/null)" = 'password=[REDACTED]'
          test "$(echo 'token=x' | /tmp/run/bin/python -m spymonk_redact 2>/dev/null)" = 'token=[REDACTED]'
          status=0; /tmp/run/bin/python -m spymonk_redact --max-line-bytes 5 2>/dev/null || status=$?
          test "$status" -eq 2
      - name: Archives are reproducible
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          bin="$(ls /tmp/run/bin/spymonk-redact)"
          a="$(python3 -I tools/package-archive.py binary /tmp/a.tar.gz "$bin" LICENSE | cut -d' ' -f2)"
          b="$(python3 -I tools/package-archive.py binary /tmp/b.tar.gz "$bin" LICENSE | cut -d' ' -f2)"
          test "$a" = "$b"

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Every commit carries a DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $c has no Signed-off-by line"; missing=1
            fi
          done
          exit $missing
