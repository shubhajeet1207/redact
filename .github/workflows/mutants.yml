name: Mutation testing

# TRD §21.1 (M1): cargo-mutants over the engine, weekly and on demand. Surviving mutants are a
# review list, not a merge gate: the job publishes them in the summary and as an artifact.
on:
  schedule:
    - cron: "7 2 * * 6"
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_MUTANTS_VERSION: 27.1.0

jobs:
  mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain and cargo-mutants
        run: |
          rustup toolchain install
          cargo install cargo-mutants --version "$CARGO_MUTANTS_VERSION" --locked
      - name: Mutants (shard ${{ matrix.shard }} of 4)
        run: |
          status=0
          cargo mutants --package spymonk-redact-core --shard "${{ matrix.shard }}/4" \
            --timeout-multiplier 3 --no-shuffle || status=$?
          {
            echo "### Mutation testing, shard ${{ matrix.shard }}/4 (exit $status)"
            for kind in caught missed timeout unviable; do
              f="mutants.out/$kind.txt"
              echo "- $kind: $( [ -f "$f" ] && wc -l < "$f" || echo 0)"
            done
            if [ -s mutants.out/missed.txt ]; then
              echo; echo '<details><summary>Missed mutants</summary>'; echo; echo '```'
              cat mutants.out/missed.txt; echo '```'; echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # 0 all caught, 2 some missed, 3 timeouts: reported above; anything else is a failure.
          case "$status" in 0|2|3) exit 0 ;; *) exit "$status" ;; esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out/
          retention-days: 30
