version: 2
updates:
  # TRD §14.3: non-security updates wait 7 days so compromised releases can be caught upstream.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Playwright 1.64 bundles WebKit 27.2, which reports a style-src-attr CSP violation for every
      # <select> (WebKit bug 327212) and fails the e2e CSP checks. Wait for the next minor release.
      - dependency-name: "@playwright/test"
        versions: ["1.64.x"]
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
