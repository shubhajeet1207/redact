# cargo-deny policy (TRD §14.3). Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between this workspace's own crates carry no version; that is allowed only
# because every crate is `publish = false`. Registry wildcards stay denied.
allow-wildcard-paths = true
# Networking, TLS, and process crates must never enter the dependency graph (TRD §9.8).
deny = [
  { crate = "reqwest" },
  { crate = "hyper" },
  { crate = "h2" },
  { crate = "ureq" },
  { crate = "curl" },
  { crate = "isahc" },
  { crate = "mio" },
  { crate = "socket2" },
  { crate = "openssl" },
  { crate = "native-tls" },
  { crate = "rustls" },
  { crate = "duct" },
  { crate = "tokio" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
